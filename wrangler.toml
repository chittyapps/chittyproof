name = "chittyproof"
main = "src/worker.js"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]
[[tail_consumers]]
service = "chittytrack"

[routes]
pattern = "proof.chitty.cc/*"
zone_name = "chitty.cc"

[vars]
SERVICE_NAME = "chittyproof"
SERVICE_VERSION = "1.0.0"

[[kv_namespaces]]
binding = "PROOF_KEY_CACHE"
id = "TBD"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
destinations = ["chittytrack-logs"]

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["chittytrack-traces"]
persist = false
